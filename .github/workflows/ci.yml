name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  storage-compatibility:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
      SPRITESAGE_TEST_NATIVE_CREDENTIALS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install storage test dependencies
        run: python -m pip install "PySide6==6.8.3" "platformdirs>=4,<5" "keyring>=25.6,<26" pytest
      - name: Install Linux credential service
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y gnome-keyring dbus-x11 libegl1
      - name: Test storage on Windows and macOS
        if: runner.os != 'Linux'
        run: python -m pytest -o addopts="" tests/test_settings.py tests/test_persistence.py tests/test_config.py tests/test_platform_storage.py
      - name: Test storage with Linux Secret Service
        if: runner.os == 'Linux'
        shell: bash
        run: |
          dbus-run-session -- bash -e -c '
            printf "%s" "disposable-ci-password" | gnome-keyring-daemon --unlock --components=secrets
            python -m pytest -o addopts="" tests/test_settings.py tests/test_persistence.py tests/test_config.py tests/test_platform_storage.py
          '

  test:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Create virtual environment
        run: python -m venv venv

      - name: Install project
        run: venv\Scripts\python.exe -m pip install -e ".[dev]"

      - name: Check formatting
        run: venv\Scripts\python.exe -m black --check src tests

      - name: Run lint
        run: venv\Scripts\python.exe -m ruff check src tests

      - name: Prepare Godot 4.4.1 preservation tests
        shell: pwsh
        run: |
          $godotTestDir = Join-Path $env:RUNNER_TEMP "spritesage-godot-4.4.1"
          New-Item -ItemType Directory -Path $godotTestDir -Force | Out-Null
          $godotTestZip = Join-Path $godotTestDir "godot.zip"
          Invoke-WebRequest -Uri "https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_win64.exe.zip" -OutFile $godotTestZip
          Expand-Archive -LiteralPath $godotTestZip -DestinationPath $godotTestDir
          New-Item -ItemType File -Path (Join-Path $godotTestDir "_sc_") | Out-Null
          "SPRITESAGE_GODOT=$(Join-Path $godotTestDir 'Godot_v4.4.1-stable_win64_console.exe')" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Run tests
        run: venv\Scripts\python.exe -m pytest

  build-executable:
    runs-on: windows-latest
    needs: [test, storage-compatibility]
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Create virtual environment
        run: python -m venv venv

      - name: Install project
        run: venv\Scripts\python.exe -m pip install -e ".[dev]"

      - name: Build executable
        run: venv\Scripts\python.exe -m PyInstaller main.spec
